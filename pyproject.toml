[project]
name = "sentinellog"
version = "0.1.0"
description = "Explainable anomaly triage for SSH authentication logs: brute-force/credential-stuffing, impossible-travel and off-baseline-time detectors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinellog*"]
